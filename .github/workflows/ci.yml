name: hts-emr ci

on: 
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
      
    
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: 코드 내려받기
        uses: actions/checkout@v4
      
      - name: JDK 21 설치
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21.0.13+9
      
      - name: Gradle 준비
        uses: gradle/actions/setup-gradle@v4 
        
      - name: 테스트 수행
        run: ./gradlew test
        
      - name: 테스트 리포트 올리기 (실패했을 경우)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: build/reports/tests/test
  
  docker-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 코드 내려받기
        uses: actions/checkout@v4
        
      - name: Dockerfile이 빌드되는지 확인 (push 하지 않음)
        run: docker build -t hts-emr:ci .
    