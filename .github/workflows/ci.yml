name: hts-emr ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
      
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: 코드 받기
        uses: actions/checkout@v4
      - name: JDK 21 설치
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      
      - name: Gradle 준비
        uses: gradle/actions/setup-gradle@v4
        
      - name: 테스트
        run: ./gradlew test
          
        
