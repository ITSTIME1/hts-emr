name: hts-emr

# blue와 green이 똑같이 쓰는 설정을 한 곳에 모아 둔다
x-app: &app

  # DB는 모든 앱이 1개의 DB만 바라본다
  environment:
    SPRING_DATASOURCE_URL: jdbc:oracle:thin:@oracle:1521/FREEPDB1
    SPRING_DATASOURCE_USERNAME: emr
    SPRING_DATASOURCE_PASSWORD: emr
  depends_on:
    oracle:
      condition: service_healthy
  healthcheck:
    test: ["CMD", "curl", "-fs", "http://localhost:8080/actuator/health/readiness"]
    interval: 5s
    timeout: 3s
    start_period: 60s
    retries: 3
  stop_grace_period: 30s
  mem_limit: 1g
  restart: unless-stopped

services:
  oracle:
    image: gvenzl/oracle-free:23-slim-faststart
    environment:
      ORACLE_PASSWORD: oracle
      APP_USER: emr
      APP_USER_PASSWORD: emr
    ports:
      - "1521:1521"
    volumes:
      - oracle-data:/opt/oracle/oradata
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 10s
      timeout: 5s
      start_period: 120s
      retries: 10

  app-blue:
    <<: *app
    image: hts-emr:${BLUE_TAG:-local}
    ports:
      - "8081:8080"

  app-green:
    <<: *app
    image: hts-emr:${GREEN_TAG:-local}
    ports:
      - "8082:8080"

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      # 파일이 아니라 폴더를 마운트해야 active.conf를 바꿨을 때 컨테이너가 새 내용을 본다
      - ./nginx/upstream:/etc/nginx/upstream:ro
    depends_on:
      app-blue:
        condition: service_healthy
    restart: unless-stopped

volumes:
  oracle-data:
