name: hts-emr

x-app: &app

  environment:
    SPRING_DATASOURCE_URL: jdbc:oracle:thin:@oracle:1521/FREEPDB1
    SPRING_DATASOURCE_USERNAME: emr
    SPRING_DATASOURCE_PASSWORD: ${APP_USER_PASSWORD:?.env에 APP_USER_PASSWORD가 필요합니다}

  depends_on:
    oracle:
      condition: service_healthy

  healthcheck:
    test: ["CMD", "curl", "-fs", "http://localhost:8080/actuator/health/readiness"]
    interval: 5s
    timeout: 3s
    start_period: 60s
    retries: 3

  stop_grace_period: 30s
  mem_limit: 1g
  restart: unless-stopped


services:
  oracle:
    image: gvenzl/oracle-free:23-slim-faststart
    environment:
      ORACLE_PASSWORD: ${ORACLE_PASSWORD:?.env에 ORACLE_PASSWORD가 필요합니다}
      APP_USER: emr
      APP_USER_PASSWORD: ${APP_USER_PASSWORD:?.env에 APP_USER_PASSWORD가 필요합니다}
    ports:
      - "1521:1521"
    volumes:
      - oracle-data:/opt/oracle/oradata
    healthcheck:
      test: [ "CMD", "healthcheck.sh" ]
      interval: 10s
      timeout: 5s
      start_period: 120s
      retries: 10

  # <<: *app App 컨테이너에 적용할 공통 설정을 별도로 분리
  app-blue:
    <<: *app
    image: hts-emr:${BLUE_TAG:-local}
    ports:
      - "8081:8080"
  app-green:
    <<: *app
    image: hts-emr:${GREEN_TAG:-local}
    ports:
      - "8082:8080"

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/upstream:/etc/nginx/upstream:ro
    depends_on:
      app-blue:
        condition: service_healthy
    restart: unless-stopped

volumes:
  oracle-data: