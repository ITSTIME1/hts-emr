# 고정 설정. 어느 쪽(blue/green)으로 보낼지는 upstream/active.conf에서 정한다
include /etc/nginx/upstream/active.conf;

map $http_x_request_id $emr_request_id {
    default $http_x_request_id;
    ""      $request_id;
}

map $upstream_http_x_request_id $emr_logged_request_id {
    default $upstream_http_x_request_id;
    ""      $emr_request_id;
}

log_format emr_json escape=json
    '{"@timestamp":"$time_iso8601","src":"nginx","requestId":"$emr_logged_request_id",'
    '"sessionId":"$http_x_session_id","method":"$request_method","uri":"$uri","status":$status,'
    '"color":"$active_color","upstreamStatus":"$upstream_status",'
    '"upstreamSeconds":"$upstream_response_time","requestSeconds":"$request_time"}';

server {
    listen 80;

    access_log /dev/stdout emr_json;

    location = /nginx-health {
        access_log off;
        return 200 "ok\n";
    }

    location ^~ /actuator/prometheus {
        return 404;
    }

    location / {
        proxy_pass http://emr_app;

        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id      $emr_request_id;

        proxy_connect_timeout 2s;
        proxy_read_timeout    30s;

        proxy_hide_header X-Request-Id;
        add_header X-Request-Id   $emr_logged_request_id always;
        add_header X-Active-Color $active_color always;
    }
}
