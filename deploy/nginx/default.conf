# 고정 설정. 어느 쪽(blue/green)으로 보낼지는 upstream/active.conf에서 정한다
include /etc/nginx/upstream/active.conf;

server {
    listen 80;

    # nginx 자체가 살아 있는지 확인용
    location = /nginx-health {
        access_log off;
        return 200 "ok\n";
    }

    location / {
        proxy_pass http://emr_app;

        # 앱과의 연결을 재사용(upstream keepalive와 짝)
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 2s;
        proxy_read_timeout    30s;

        # 응답이 어느 쪽에서 왔는지 보여 준다
        add_header X-Active-Color $active_color always;
    }
}
