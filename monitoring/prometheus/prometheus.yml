global:
  scrape_interval: 15s
  scrape_timeout: 10s
  evaluation_interval: 15s

rule_files:
  - rules/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

scrape_configs:
  - job_name: hts-emr
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - hts-server:8081
          - hts-server:8082
