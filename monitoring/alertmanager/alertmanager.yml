templates:
  - /etc/alertmanager/templates/*.tmpl

route:
  receiver: slack-warning
  group_by: [alertname]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 12h
  routes:
    - matchers: [severity="critical"]
      receiver: slack-critical
      group_wait: 10s
      group_interval: 1m
      repeat_interval: 1h

inhibit_rules:
  - source_matchers: [alertname="HtsEmrAllTargetsDown"]
    target_matchers: [alertname=~"HtsEmrServingInstanceDown|HtsEmrInstanceDown"]
  - source_matchers: [alertname="HtsEmrServingInstanceDown"]
    target_matchers: [alertname="HtsEmrInstanceDown"]
    equal: [instance]

receivers:
  - name: slack-critical
    slack_configs:
      - api_url_file: /run/secrets/slack_webhook_url
        send_resolved: true
        color: '{{ template "hts.slack.color" . }}'
        pretext: '{{ if eq .Status "firing" }}<!here>{{ end }}'
        title: '{{ template "hts.slack.title" . }}'
        text: '{{ template "hts.slack.text" . }}'

  - name: slack-warning
    slack_configs:
      - api_url_file: /run/secrets/slack_webhook_url
        send_resolved: true
        color: '{{ template "hts.slack.color" . }}'
        title: '{{ template "hts.slack.title" . }}'
        text: '{{ template "hts.slack.text" . }}'
