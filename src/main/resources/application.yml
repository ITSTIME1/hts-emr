spring:
  application:
    name: hts-emr
  jpa:
    # 요청 처리 중 지연 로딩이 화면 계층까지 새어 나가지 않게 한다
    open-in-view: false
    hibernate:
      # 스키마는 Flyway가 만든다. Hibernate는 엔티티와 스키마가 맞는지만 확인한다
      ddl-auto: validate
  flyway:
    locations: classpath:db/migration

logging:
  structured:
    format:
      # 콘솔(stdout)로 JSON 한 줄씩 낸다. MDC 값(requestId 등)은 최상위 필드로 같이 나간다
      console: ecs
    ecs:
      service:
        # 어느 배포(blue/green)의 어느 버전이 처리했는지 모든 줄에 남긴다. 컨테이너 환경변수로 주입한다
        environment: ${APP_ENV:local}
        node-name: ${APP_COLOR:local}
        version: ${APP_VERSION:local}
